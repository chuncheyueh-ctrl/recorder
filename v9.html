<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>中正國小直笛團｜V9</title>
<style>
:root{--bg:#f6f3ec;--card:#fff;--line:#e5ddd1;--primary:#7a4b25;--red:#9f3532;--muted:#756b60;--green:#2f8f62}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;color:#2b2620}
header{position:sticky;top:0;z-index:10;background:rgba(246,243,236,.96);border-bottom:1px solid var(--line);padding:14px}
h1{font-size:22px;margin:0}h2{margin:0 0 10px}.sub,.muted{color:var(--muted);font-size:13px}
main{max-width:1080px;margin:auto;padding:14px 14px 90px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:15px;margin-bottom:12px;box-shadow:0 8px 24px #0001}
.row,.actions,.btns{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}.actions,.btns{justify-content:flex-start}
button{border:0;border-radius:999px;background:var(--primary);color:white;padding:11px 15px;font-weight:800;cursor:pointer;min-height:42px}
button.secondary{background:white;color:#654120;border:1px solid var(--line)}button.danger{background:var(--red)}button:disabled{opacity:.5}
.badge{display:inline-flex;border-radius:999px;background:#e2f5ea;color:var(--green);padding:5px 9px;font-size:12px;font-weight:900}
.empty{padding:12px;border:1px dashed var(--line);border-radius:15px;background:#fffdf8;color:var(--muted)}.grid{display:grid;gap:10px}
.box,.note,.slot{border:1px solid var(--line);border-radius:16px;background:#fffdf8;padding:12px;margin-top:8px}.handoff{border-left:5px solid var(--primary);background:#fff7ea}
.name{font-size:18px;font-weight:900}.note p{margin:5px 0;font-size:14px}.meta{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:8px;overflow:auto;padding-bottom:4px}.tab{background:white;color:#654120;border:1px solid var(--line);white-space:nowrap}.tab.active{background:var(--primary);color:white}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.dow{text-align:center;color:var(--muted);font-size:12px}.day{min-height:88px;border:1px solid var(--line);border-radius:12px;background:#fffdf8;padding:7px;font-size:13px}.other{opacity:.35}.event{margin-top:4px;padding:4px 6px;border-radius:8px;background:#efe6d9;font-size:12px}
.analytics{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.stat{background:#fffdf8;border:1px solid var(--line);border-radius:15px;padding:10px;text-align:center}.stat b{font-size:24px;display:block}
.bar{display:flex;align-items:center;gap:8px;margin:6px 0}.bar span:first-child{width:92px;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.barline{height:10px;background:#efe6d9;border-radius:99px;flex:1;overflow:hidden}.barfill{height:100%;background:var(--primary)}
dialog{width:min(860px,calc(100vw - 18px));border:0;border-radius:22px;padding:0;box-shadow:0 20px 60px #0004}dialog::backdrop{background:#0006}.head{padding:16px;background:#fff7ea;border-bottom:1px solid var(--line);border-radius:22px 22px 0 0}.body{padding:16px;max-height:75vh;overflow:auto}.foot{padding:14px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.form{display:grid;gap:12px}label{display:grid;gap:5px;font-weight:900;font-size:14px}input,textarea,select{width:100%;border:1px solid var(--line);border-radius:13px;padding:11px;font:inherit;background:white}textarea{min-height:82px}.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px}.check{display:flex;gap:7px;align-items:center;border:1px solid var(--line);border-radius:13px;padding:10px;background:white}.check input{width:auto}.student-chip{display:inline-block;margin:4px;padding:9px 11px;border-radius:999px;background:#efe6d9;cursor:pointer;font-size:14px}.selected{background:#e2f5ea;font-weight:900}.student-box{min-height:110px;border:1px solid var(--line);border-radius:14px;padding:8px;background:white}.loading{position:fixed;left:12px;bottom:16px;background:#2b2620;color:white;border-radius:999px;padding:8px 12px;font-size:13px;display:none}.fab{position:fixed;right:16px;bottom:18px}
@media(min-width:760px){.grid{grid-template-columns:1fr 1fr}.checks{grid-template-columns:repeat(4,1fr)}.analytics{grid-template-columns:repeat(4,1fr)}.day{min-height:115px}}
</style>
</head>
<body>
<header><h1>中正國小直笛團｜教師交接與行事曆</h1><div class="sub">V9：編輯鎖、紀錄可編輯、選項可管理、文字提示</div></header>
<main>
<section class="card"><div class="row"><button class="secondary" id="prevWeek">上一週</button><div><h2 id="weekLabel">讀取中……</h2><div class="muted">手動重新整理，避免重複寫入。</div></div><button class="secondary" id="nextWeek">下一週</button></div><div class="btns"><button id="openPlan">填寫本週進度</button><button class="secondary" id="openSettings">設定中心</button><button class="secondary" id="refresh">重新整理</button></div></section>
<section class="card" style="background:#fff7ea"><h2 id="todayTitle"></h2><div id="todayPanel" class="grid"></div></section>
<section class="card"><h2>本週教學分析</h2><div id="analytics" class="analytics"></div><div id="analyticsBars" class="grid"></div></section>
<section class="card"><div class="row"><h2>行事曆</h2><div><button class="secondary" id="prevMonth">上個月</button><button class="secondary" id="nextMonth">下個月</button></div></div><h3 id="monthLabel"></h3><div class="calendar" id="calendar"></div></section>
<section class="card"><h2>本週總進度</h2><div id="planView" class="empty">讀取中……</div></section>
<section class="card"><div class="row"><h2>老師教學進度牆</h2><span class="badge" id="teacherCount">0 位老師</span></div><div id="teacherWall" class="grid"></div></section>
<section class="card"><h2>交接提醒區</h2><div id="handoffList"></div></section>
<section class="card"><h2>依日期與時段查看</h2><div class="tabs" id="tabs"></div><div id="slotList"></div></section>
</main>
<button class="fab" id="quickAdd">＋ 新增紀錄</button><div class="loading" id="loading">同步中……</div>

<dialog id="settingsDialog"><form><div class="head"><div class="row"><h2>設定中心</h2><button type="button" class="secondary close">關閉</button></div></div><div class="body grid"><div class="box"><h3>老師管理</h3><button type="button" id="addTeacher">新增老師</button><div id="teacherSettings"></div></div><div class="box"><h3>學生名單</h3><button type="button" id="addStudent">新增學生</button><div id="studentSettings"></div></div><div class="box"><h3>行事曆</h3><button type="button" id="addEvent">新增事件</button></div>
<div class="box"><h3>勾選選項管理</h3>
<label>類型<select id="configType"><option value="issue">團體問題類型</option><option value="part">聲部／學生</option><option value="focus">重點標記</option></select></label>
<label>新增文字<input id="configValue" placeholder="例如：節奏不穩、換氣需要加強"></label>
<button type="button" id="addConfigOption">新增選項</button>
<div id="configList"></div></div></div></form></dialog>
<dialog id="teacherDialog"><form id="teacherForm"><div class="head"><div class="row"><h2>老師資料</h2><button type="button" class="secondary close">關閉</button></div></div><div class="body form"><label>姓名<input id="teacherName" required></label><label>備註<input id="teacherNote"></label></div><div class="foot"><button type="submit">儲存</button></div></form></dialog>
<dialog id="studentDialog"><form id="studentForm"><div class="head"><div class="row"><h2>學生資料</h2><button type="button" class="secondary close">關閉</button></div></div><div class="body form"><label>姓名<input id="studentName" required></label><label>年級<input id="studentGrade"></label><label>所屬團別<div class="checks" id="studentGroupChecks"></div></label><label>備註<input id="studentNote"></label></div><div class="foot"><button type="submit">儲存</button></div></form></dialog>
<dialog id="planDialog"><form id="planForm"><div class="head"><div class="row"><h2>本週總進度</h2><button type="button" class="secondary close">關閉</button></div></div><div class="body form"><label>本週目標<textarea id="goal"></textarea></label><label>整體進度<textarea id="overall"></textarea></label><label>曲目<textarea id="pieces"></textarea></label><label>提醒<textarea id="notes"></textarea></label><label>填寫老師<input id="planTeacher"></label></div><div class="foot"><button type="submit">儲存</button></div></form></dialog>
<dialog id="eventDialog"><form id="eventForm"><div class="head"><div class="row"><h2>行事曆事件</h2><button type="button" class="secondary close">關閉</button></div></div><div class="body form"><label>日期<input id="eventDate" type="date" required></label><label>標題<input id="eventTitle" required></label><label>類型<select id="eventType"><option value="practice">練習</option><option value="club">社團課</option><option value="extra">加練</option><option value="exam">考試／考核</option><option value="show">演出</option><option value="cancel">停課</option><option value="admin">行政提醒</option><option value="other">其他</option></select></label><label>時間<input id="eventTime"></label><label>地點<input id="eventLocation"></label><label>備註<textarea id="eventNote"></textarea></label></div><div class="foot"><button type="submit">儲存</button></div></form></dialog>
<dialog id="recordDialog"><form id="recordForm"><div class="head"><div class="row"><h2>新增教學紀錄</h2><button type="button" class="secondary close">關閉</button></div></div><div class="body form"><label>團別<select id="recordGroup"></select></label><label>老師<select id="recordTeacher"></select></label><label>日期時段<select id="recordSlot"></select></label><label>團體進度階段<select id="groupProgressStage"><option>未開始</option><option selected>練習中</option><option>可慢速完成</option><option>可跟節拍器完成</option><option>可合奏</option><option>可演出</option></select></label><label>團體穩定度<select id="groupStability"><option>很不穩定</option><option selected>偶爾成功</option><option>多數可完成</option><option>穩定完成</option></select></label><label>團體問題類型<div class="checks" id="groupIssueChecks"></div></label><label>聲部／學生<div class="checks" id="partChecks"></div></label><label>其他補充<input id="partOther"></label><label>本堂學生<div class="grid"><div><b>可選學生</b><div class="student-box" id="availableStudents"></div></div><div><b>本堂學生</b><div class="student-box" id="selectedStudents"></div></div></div></label><label>重點學生<div id="focusEditor"></div></label><label>重點標記<div class="checks" id="focusTagChecks"></div></label><label>今天教學<textarea id="content" placeholder="今天教了什麼？例如：祭典A段、節奏練習、音階練習、合奏段落"></textarea></label><label>目前進度<textarea id="progress" placeholder="目前到哪個段落？完成度如何？例如：A段穩定、B段仍需慢練、能跟節拍器"></textarea></label><label>學生狀況<textarea id="studentStatus" placeholder="學生整體或個別狀況，例如：注意力不集中、有進步、某學生節奏需加強"></textarea></label><label>交接<textarea id="handoff" placeholder="下一位老師需要注意什麼？例如：請加強節奏、某學生需個別指導、下次從B段開始"></textarea></label><label>狀態<select id="state"><option>未完成</option><option selected>部分完成</option><option>已完成</option></select></label></div><div class="foot"><button type="submit">送出</button></div></form></dialog>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbzIt6SlhoV7cykyLvmv3z9TI5cGOqgY8uK1ewyeBJ9lU6iLtCfx3yN1lIReSPE_QrxV/exec";
const DAYS=["週一","週二","週三","週四","週五","週六","週日"],BASIC=[["m","早自習","上午"],["n","中午練習","中午"]],FRI=[["club","社團課","13:00–15:00"],["extra","加強課","17:00–17:30"]];
const PARTS=["高音笛一部","高音笛二部","中音笛","次中音笛","低音笛","個別學生","臨時分組","其他"],ISSUES=["節奏","音準","指法","換氣","音色","速度","合奏聆聽","看譜","專注度"],FOCUS_TAGS=["跟不上","節奏問題","音準問題","指法問題","需要個別指導","注意力不穩","表現突出","可帶領"];
const EVENT_LABEL={practice:"練習",club:"社團課",extra:"加練",exam:"考試／考核",show:"演出",cancel:"停課",admin:"行政提醒",other:"其他"};
let monday=getMonday(new Date()),activeDay=(new Date().getDay()||7)-1,monthDate=new Date(),editTeacherId=null,editStudentId=null,editingRecordId=null,currentLockKey='',selectedStudentIds=[],focusStudentIds=[],busy=false;
let appData={teachers:[],students:[],groups:["初階","中階","大團","社團課","個別加強","其他"],records:[],events:[],plan:{},analytics:{},config:{issue:ISSUES,part:PARTS,focus:FOCUS_TAGS}};
const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m])),pad=n=>String(n).padStart(2,"0"),iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
function reqId(){return Date.now()+"-"+Math.random().toString(36).slice(2)}
function getMonday(d){d=new Date(d);d.setHours(0,0,0,0);const day=d.getDay();d.setDate(d.getDate()-day+(day===0?-6:1));return d}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function weekNo(d){const x=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())),day=x.getUTCDay()||7;x.setUTCDate(x.getUTCDate()+4-day);const y=new Date(Date.UTC(x.getUTCFullYear(),0,1));return Math.ceil((((x-y)/86400000)+1)/7)}
function wd(i){return["一","二","三","四","五","六","日"][i]}function fullDate(i){const d=addDays(monday,i);return d.getFullYear()+"/"+(d.getMonth()+1)+"/"+d.getDate()+"（"+wd(i)+"）"}function dateKey(i){return iso(addDays(monday,i))}function monthKey(){return monthDate.getFullYear()+"-"+pad(monthDate.getMonth()+1)}function slots(i){return i===4?BASIC.concat(FRI):BASIC}function slotLabel(s){return s[1]+" "+s[2]}function allSlots(){let a=[];DAYS.forEach((d,i)=>slots(i).forEach(s=>a.push({dayIndex:i,slotKey:s[0],label:fullDate(i)+"｜"+slotLabel(s)})));return a}function loading(v){$("loading").style.display=v?"block":"none"}
async function apiGet(){if(API_URL.includes("PASTE_YOUR"))return alert("請先貼 Apps Script 網址");loading(true);try{const r=await fetch(API_URL+"?weekStart="+encodeURIComponent(iso(monday))+"&month="+encodeURIComponent(monthKey())+"&t="+Date.now());const text=await r.text();let data={};try{data=JSON.parse(text)}catch(e){throw new Error("後端回傳不是JSON："+text.slice(0,120))}if(data.ok===false)throw new Error(data.message||data.error||"後端讀取失敗");appData=data;render()}catch(e){console.error(e);alert("讀取失敗："+e.message)}finally{loading(false)}}
async function apiPost(payload){if(busy)return;busy=true;loading(true);document.querySelectorAll("button").forEach(b=>b.disabled=true);try{payload.requestId=payload.requestId||reqId();const r=await fetch(API_URL,{method:"POST",body:JSON.stringify(payload),headers:{"Content-Type":"text/plain;charset=utf-8"}});const text=await r.text();let res={};try{res=JSON.parse(text)}catch(e){throw new Error("後端回傳不是JSON："+text.slice(0,120))}if(res.ok===false)throw new Error(res.message||res.error||"後端寫入失敗");await apiGet();return res}catch(e){console.error(e);alert("寫入失敗："+e.message);throw e}finally{busy=false;loading(false);document.querySelectorAll("button").forEach(b=>b.disabled=false)}}
function render(){renderWeek();renderToday();renderAnalytics();renderCalendar();renderPlan();renderTeachers();renderHandoffs();renderSlots();if($("settingsDialog").open)renderSettings()}
function renderWeek(){const e=addDays(monday,6);$("weekLabel").textContent="第"+weekNo(monday)+"週｜"+monday.getFullYear()+"/"+(monday.getMonth()+1)+"/"+monday.getDate()+"（一）～"+e.getFullYear()+"/"+(e.getMonth()+1)+"/"+e.getDate()+"（日）"}
function note(r){return'<div class="note '+(r.handoff?'handoff':'')+'"><div class="meta">'+esc(r.teacher)+'｜'+esc(r.group)+'｜'+esc(r.date)+'｜'+esc(r.slot)+'<br>'+esc(r.timestamp)+'</div><p><b>進度：</b>'+esc((r.groupProgressStage||"")+"｜"+(r.groupStability||""))+'</p><p><b>本堂學生：</b>'+esc(r.studentNames)+'</p><p><b>重點學生：</b>'+esc(r.focusStudentNames)+' '+esc((r.focusTags||[]).join? r.focusTags.join("、") : r.focusTags)+'</p><p><b>教學：</b>'+esc(r.content)+'</p><p><b>目前進度：</b>'+esc(r.progress)+'</p><p><b>學生狀況：</b>'+esc(r.studentStatus)+'</p><p><b>交接：</b>'+esc(r.handoff)+'</p><div class="actions"><button class="secondary" data-action="edit-record" data-id="'+esc(r.recordId)+'">編輯紀錄</button></div></div>'}
function planHtml(){const p=appData.plan||{};return(p.goal||p.overall||p.pieces||p.notes)?(p.goal?'<p><b>目標：</b>'+esc(p.goal)+'</p>':'')+(p.overall?'<p><b>進度：</b>'+esc(p.overall)+'</p>':'')+(p.pieces?'<p><b>曲目：</b>'+esc(p.pieces)+'</p>':'')+(p.notes?'<p><b>提醒：</b>'+esc(p.notes)+'</p>':''):'<div class="empty">尚未填寫。</div>'}
function renderToday(){const n=new Date(),tk=iso(n),di=(n.getDay()||7)-1;$("todayTitle").textContent=n.getFullYear()+"/"+(n.getMonth()+1)+"/"+n.getDate()+"（"+["日","一","二","三","四","五","六"][n.getDay()]+"）";const ev=appData.events.filter(e=>e.date===tk),rs=appData.records.filter(r=>r.dateKey===tk),ho=rs.filter(r=>r.handoff);$("todayPanel").innerHTML='<div class="box"><h3>今天課程</h3>'+slots(di).map(s=>'<div class="note"><b>'+esc(s[1])+'</b><br><span class="muted">'+esc(s[2])+'</span></div>').join("")+'</div><div class="box"><h3>今天行事曆</h3>'+(ev.length?ev.map(eventHtml).join(""):'<div class="empty">今天尚無事件。</div>')+'</div><div class="box"><h3>今日交接</h3>'+(ho.length?ho.map(note).join(""):'<div class="empty">今天尚無交接。</div>')+'</div><div class="box"><h3>本週重點</h3>'+planHtml()+'</div>'}
function renderAnalytics(){const a=appData.analytics||{};$("analytics").innerHTML='<div class="stat"><b>'+esc(a.totalRecords||0)+'</b><span>本週紀錄</span></div><div class="stat"><b>'+esc(a.totalHandoffs||0)+'</b><span>交接提醒</span></div><div class="stat"><b>'+esc((a.groupCounts||[]).length)+'</b><span>有紀錄團別</span></div><div class="stat"><b>'+esc((a.focusStudentCounts||[]).length)+'</b><span>重點學生</span></div>';$("analyticsBars").innerHTML='<div class="box"><h3>各團紀錄</h3>'+bars(a.groupCounts||[])+'</div><div class="box"><h3>重點標記</h3>'+bars(a.focusTagCounts||[])+'</div><div class="box"><h3>常被標記學生</h3>'+bars(a.focusStudentCounts||[])+'</div><div class="box"><h3>團體進度階段</h3>'+bars(a.progressStageCounts||[])+'</div>'}
function bars(list){if(!list.length)return'<div class="empty">尚無資料</div>';const max=Math.max(...list.map(x=>x.count));return list.slice(0,8).map(x=>'<div class="bar"><span>'+esc(x.name)+'</span><div class="barline"><div class="barfill" style="width:'+(x.count/max*100)+'%"></div></div><b>'+x.count+'</b></div>').join("")}
function eventHtml(e){return'<div class="event"><b>'+esc(EVENT_LABEL[e.type]||"事件")+'</b>｜'+esc((e.time?e.time+" ":"")+e.title)+' <button class="danger" data-action="archive-event" data-id="'+esc(e.eventId)+'">封存</button></div>'}
function renderCalendar(){const y=monthDate.getFullYear(),m=monthDate.getMonth();$("monthLabel").textContent=y+" 年 "+(m+1)+" 月";let h=["一","二","三","四","五","六","日"].map(d=>'<div class="dow">週'+d+'</div>').join("");const first=new Date(y,m,1),start=new Date(first);start.setDate(1-((first.getDay()+6)%7));for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const ds=iso(d),ev=appData.events.filter(e=>e.date===ds);h+='<div class="day '+(d.getMonth()===m?'':'other')+'"><b>'+d.getDate()+'</b>'+ev.map(eventHtml).join("")+'</div>'}$("calendar").innerHTML=h}
function renderPlan(){$("planView").innerHTML=planHtml()}
function renderTeachers(){$("teacherWall").innerHTML="";$("teacherCount").textContent=appData.teachers.length+" 位老師";$("teacherWall").innerHTML=appData.teachers.length?appData.teachers.map((t,i)=>{const rs=appData.records.filter(r=>r.teacherId===t.teacherId).slice().reverse();return'<div class="box"><div class="row"><div><div class="name">'+esc(t.name)+'</div><div class="muted">'+esc(t.note)+'</div><span class="badge">'+rs.length+' 筆</span></div><div class="actions"><button data-action="record" data-index="'+i+'">新增紀錄</button><button class="secondary" data-action="edit-teacher" data-index="'+i+'">修改</button><button class="danger" data-action="archive-teacher" data-index="'+i+'">封存</button></div></div>'+rs.slice(0,4).map(note).join("")+'</div>'}).join(""):'<div class="empty">尚未新增老師。</div>'}
function renderHandoffs(){const rs=appData.records.filter(r=>r.handoff).slice().reverse();$("handoffList").innerHTML=rs.length?rs.slice(0,8).map(note).join(""):'<div class="empty">目前沒有交接提醒。</div>'}
function renderSlots(){$("tabs").innerHTML=DAYS.map((d,i)=>{const dt=addDays(monday,i);return'<button class="tab '+(i===activeDay?'active':'')+'" data-day="'+i+'">'+(dt.getMonth()+1)+"/"+dt.getDate()+"（"+wd(i)+"）</button>"}).join("");$("slotList").innerHTML=slots(activeDay).map(s=>{const dk=dateKey(activeDay),sl=slotLabel(s),rs=appData.records.filter(r=>r.dateKey===dk&&r.slot===sl).slice().reverse();return'<div class="slot"><div class="row"><h3>'+esc(s[1])+'｜'+esc(s[2])+'</h3><span class="badge">'+rs.length+' 筆</span></div>'+(rs.length?rs.map(note).join(""):'<div class="empty">此時段尚未填寫。</div>')+'<button data-action="record-slot" data-day="'+activeDay+'" data-slot="'+esc(s[0])+'">填寫這個時段</button></div>'}).join("")}
function renderSettings(){$("teacherSettings").innerHTML=appData.teachers.map((t,i)=>'<div class="note"><b>'+esc(t.name)+'</b><div class="actions"><button class="secondary" data-action="edit-teacher" data-index="'+i+'">修改</button><button class="danger" data-action="archive-teacher" data-index="'+i+'">封存</button></div></div>').join("")||'<div class="empty">尚未新增老師。</div>';$("studentSettings").innerHTML=appData.students.map((s,i)=>'<div class="note"><b>'+esc(s.name)+'</b><div class="muted">'+esc((s.grade?s.grade+"｜":"")+s.groups.join("、"))+'</div><div class="actions"><button class="secondary" data-action="edit-student" data-index="'+i+'">修改</button><button class="danger" data-action="archive-student" data-index="'+i+'">封存</button></div></div>').join("")||'<div class="empty">尚未新增學生。</div>';
renderConfigList()}
function checks(el,items,selected=[]){el.innerHTML=items.map(g=>'<label class="check"><input type="checkbox" value="'+esc(g)+'" '+(selected.includes(g)?'checked':'')+'>'+esc(g)+'</label>').join("")}
function openTeacher(t){editTeacherId=t?t.teacherId:null;$("teacherName").value=t?t.name:"";$("teacherNote").value=t?t.note:"";$("teacherDialog").showModal()}
function openStudent(s){editStudentId=s?s.studentId:null;$("studentName").value=s?s.name:"";$("studentGrade").value=s?s.grade:"";$("studentNote").value=s?s.note:"";checks($("studentGroupChecks"),appData.groups,s?s.groups:[]);$("studentDialog").showModal()}
function openRecord(tid=null,day=activeDay,sk=null){
if(!appData.teachers.length)return openTeacher(null);
editingRecordId=null;selectedStudentIds=[];focusStudentIds=[];
$("recordGroup").innerHTML=appData.groups.map(g=>'<option>'+esc(g)+'</option>').join("");
$("recordTeacher").innerHTML=appData.teachers.map(t=>'<option value="'+esc(t.teacherId)+'" '+(t.teacherId===tid?'selected':'')+'>'+esc(t.name)+'</option>').join("");
$("recordSlot").innerHTML=allSlots().map(s=>'<option value="'+s.dayIndex+'|'+esc(s.slotKey)+'" '+(s.dayIndex===day&&(!sk||s.slotKey===sk)?'selected':'')+'>'+esc(s.label)+'</option>').join("");
["partOther","content","progress","studentStatus","handoff"].forEach(id=>$(id).value="");
checks($("partChecks"),cfg("part",PARTS));
checks($("groupIssueChecks"),cfg("issue",ISSUES));
checks($("focusTagChecks"),cfg("focus",FOCUS_TAGS));
renderStudentPick();$("recordDialog").showModal()}
function renderStudentPick(){const g=$("recordGroup").value;const avail=appData.students.filter(s=>!g||s.groups.includes(g)).filter(s=>!selectedStudentIds.includes(s.studentId));const sel=appData.students.filter(s=>selectedStudentIds.includes(s.studentId));$("availableStudents").innerHTML=avail.map(s=>'<span class="student-chip" data-action="add-student-session" data-id="'+esc(s.studentId)+'">'+esc(s.name)+'</span>').join("")||'<div class="muted">沒有可選學生</div>';$("selectedStudents").innerHTML=sel.map(s=>'<span class="student-chip selected" data-action="remove-student-session" data-id="'+esc(s.studentId)+'">'+esc(s.name)+' ×</span>').join("")||'<div class="muted">點左邊學生加入本堂課</div>';renderFocusEditor()}
function renderFocusEditor(){const sel=appData.students.filter(s=>selectedStudentIds.includes(s.studentId));$("focusEditor").innerHTML=sel.length?sel.map(s=>'<span class="student-chip '+(focusStudentIds.includes(s.studentId)?'selected':'')+'" data-action="toggle-focus-student" data-id="'+esc(s.studentId)+'">'+esc(s.name)+'</span>').join(""):'<div class="empty">請先選本堂學生。</div>'}
function openEvent(){$("eventDate").value=iso(new Date());["eventTitle","eventTime","eventLocation","eventNote"].forEach(id=>$(id).value="");$("eventDialog").showModal()}

function cfg(type,fallback){return (appData.config&&appData.config[type]&&appData.config[type].length)?appData.config[type]:fallback}
function renderConfigList(){
  if(!$("configList"))return;
  const c=appData.config||{issue:ISSUES,part:PARTS,focus:FOCUS_TAGS};
  const labels={issue:"團體問題",part:"聲部／學生",focus:"重點標記"};
  $("configList").innerHTML=["issue","part","focus"].map(type=>'<div class="note"><b>'+labels[type]+'</b><div class="actions">'+(c[type]||[]).map(v=>'<span class="student-chip">'+esc(v)+' <button class="danger" data-action="archive-config" data-type="'+type+'" data-value="'+esc(v)+'">刪</button></span>').join("")+'</div></div>').join("");
}
function makeLockKey(day,sk){return iso(monday)+"_"+day+"_"+sk}
async function acquireRecordLock(day,sk,teacherName){
  currentLockKey=makeLockKey(day,sk);
  const res=await apiPost({action:"acquireLock",lockKey:currentLockKey,user:teacherName||"未命名老師"});
  return res&&res.ok;
}
async function releaseCurrentLock(){
  if(currentLockKey){try{await apiPost({action:"releaseLock",lockKey:currentLockKey})}catch(e){} currentLockKey=''}
}
function fillRecordForm(r){
  editingRecordId=r.recordId;
  $("recordGroup").value=r.group||"";
  $("recordTeacher").value=r.teacherId||"";
  const dIndex = Math.max(0, appData.records.find(x=>x.recordId===r.recordId)?.dateKey ? Math.round((new Date(r.dateKey)-monday)/86400000) : activeDay);
  const slotObj = allSlots().find(s=>slotLabel(slots(s.dayIndex).find(x=>x[0]===s.slotKey))===r.slot) || allSlots()[0];
  if(slotObj) $("recordSlot").value=slotObj.dayIndex+"|"+slotObj.slotKey;
  $("groupProgressStage").value=r.groupProgressStage||"練習中";
  $("groupStability").value=r.groupStability||"偶爾成功";
  checks($("partChecks"),cfg("part",PARTS),String(r.parts||"").split("、"));
  checks($("groupIssueChecks"),cfg("issue",ISSUES),r.groupIssueTypes||[]);
  checks($("focusTagChecks"),cfg("focus",FOCUS_TAGS),r.focusTags||[]);
  $("partOther").value="";
  selectedStudentIds=r.studentIds||[];
  focusStudentIds=r.focusStudentIds||[];
  $("content").value=r.content||"";
  $("progress").value=r.progress||"";
  $("studentStatus").value=r.studentStatus||"";
  $("handoff").value=r.handoff||"";
  $("state").value=r.state||"部分完成";
  renderStudentPick();
}

function bind(){
$("prevWeek").onclick=()=>{monday=addDays(monday,-7);apiGet()};$("nextWeek").onclick=()=>{monday=addDays(monday,7);apiGet()};$("prevMonth").onclick=()=>{monthDate.setMonth(monthDate.getMonth()-1);apiGet()};$("nextMonth").onclick=()=>{monthDate.setMonth(monthDate.getMonth()+1);apiGet()};$("refresh").onclick=()=>apiGet();$("openSettings").onclick=()=>{$("settingsDialog").showModal();renderSettings()};$("addTeacher").onclick=()=>openTeacher(null);$("addStudent").onclick=()=>openStudent(null);$("addEvent").onclick=openEvent;if($("addConfigOption"))$("addConfigOption").onclick=async()=>{await apiPost({action:"addConfigOption",optionType:$("configType").value,value:$("configValue").value});$("configValue").value="";};$("quickAdd").onclick=()=>openRecord(null);$("recordGroup").onchange=()=>{selectedStudentIds=[];focusStudentIds=[];renderStudentPick()};document.querySelectorAll(".close").forEach(b=>b.onclick=()=>b.closest("dialog").close());
$("openPlan").onclick=()=>{const p=appData.plan||{};$("goal").value=p.goal||"";$("overall").value=p.overall||"";$("pieces").value=p.pieces||"";$("notes").value=p.notes||"";$("planTeacher").value=p.teacher||"";$("planDialog").showModal()};
$("teacherForm").onsubmit=async e=>{e.preventDefault();await apiPost({action:editTeacherId?"updateTeacher":"addTeacher",teacherId:editTeacherId,name:$("teacherName").value,note:$("teacherNote").value});$("teacherDialog").close()};
$("studentForm").onsubmit=async e=>{e.preventDefault();await apiPost({action:editStudentId?"updateStudent":"addStudent",studentId:editStudentId,name:$("studentName").value,grade:$("studentGrade").value,note:$("studentNote").value,groups:Array.from($("studentGroupChecks").querySelectorAll("input:checked")).map(x=>x.value)});$("studentDialog").close()};
$("planForm").onsubmit=async e=>{e.preventDefault();await apiPost({action:"savePlan",week:"第"+weekNo(monday)+"週",weekStart:iso(monday),goal:$("goal").value,overall:$("overall").value,pieces:$("pieces").value,notes:$("notes").value,teacher:$("planTeacher").value});$("planDialog").close();alert("本週進度已儲存")};
$("eventForm").onsubmit=async e=>{e.preventDefault();await apiPost({action:"addEvent",date:$("eventDate").value,title:$("eventTitle").value,type:$("eventType").value,time:$("eventTime").value,location:$("eventLocation").value,note:$("eventNote").value});$("eventDialog").close()};
$("recordForm").onsubmit=async e=>{e.preventDefault();const group=$("recordGroup").value;if(!group)return alert("請選擇團別");const [dayRaw,sk]=$("recordSlot").value.split("|"),day=Number(dayRaw),slot=slots(day).find(s=>s[0]===sk);if(!slot)return alert("請重新選擇日期時段");const teacher=appData.teachers.find(t=>t.teacherId===$("recordTeacher").value);const parts=Array.from($("partChecks").querySelectorAll("input:checked")).map(x=>x.value).filter(x=>x!=="其他");const other=$("partOther").value.trim();const stud=appData.students.filter(s=>selectedStudentIds.includes(s.studentId));const focus=appData.students.filter(s=>focusStudentIds.includes(s.studentId));const focusTags=Array.from($("focusTagChecks").querySelectorAll("input:checked")).map(x=>x.value);const issueTypes=Array.from($("groupIssueChecks").querySelectorAll("input:checked")).map(x=>x.value);const payload={action:editingRecordId?"updateRecord":"addRecord",recordId:editingRecordId||"",week:"第"+weekNo(monday)+"週",weekStart:iso(monday),date:fullDate(day),dateKey:dateKey(day),slot:slotLabel(slot),group:group,teacherId:$("recordTeacher").value,teacher:teacher?teacher.name:"",parts:parts.concat(other?[other]:[]).join("、"),studentIds:stud.map(s=>s.studentId),studentNames:stud.map(s=>s.name),focusStudentIds:focus.map(s=>s.studentId),focusStudentNames:focus.map(s=>s.name),focusTags:focusTags,groupProgressStage:$("groupProgressStage").value,groupStability:$("groupStability").value,groupIssueTypes:issueTypes,content:$("content").value,progress:$("progress").value,studentStatus:$("studentStatus").value,handoff:$("handoff").value,state:$("state").value};await apiPost(payload);$("recordDialog").close();editingRecordId=null;alert(payload.action==="updateRecord"?"教學紀錄已更新":"教學紀錄已新增")};
document.addEventListener("click",async e=>{const tab=e.target.closest(".tab");if(tab){activeDay=Number(tab.dataset.day);renderSlots();return}const b=e.target.closest("[data-action]");if(!b)return;const a=b.dataset.action;if(a==="record"){const t=appData.teachers[Number(b.dataset.index)];openRecord(t?t.teacherId:null)}if(a==="record-slot")openRecord(null,Number(b.dataset.day),b.dataset.slot);if(a==="edit-teacher"){const t=appData.teachers[Number(b.dataset.index)];if(t)openTeacher(t)}if(a==="archive-teacher"&&confirm("封存老師？")){const t=appData.teachers[Number(b.dataset.index)];if(t)await apiPost({action:"archiveTeacher",teacherId:t.teacherId})}if(a==="edit-student"){const s=appData.students[Number(b.dataset.index)];if(s)openStudent(s)}if(a==="archive-student"&&confirm("封存學生？")){const s=appData.students[Number(b.dataset.index)];if(s)await apiPost({action:"archiveStudent",studentId:s.studentId})}if(a==="archive-event"&&confirm("封存事件？"))await apiPost({action:"archiveEvent",eventId:b.dataset.id});
if(a==="edit-record"){const r=appData.records.find(x=>x.recordId===b.dataset.id);if(r){openRecord(r.teacherId);setTimeout(()=>fillRecordForm(r),0)}}
if(a==="archive-config"&&confirm("刪除這個選項？"))await apiPost({action:"archiveConfigOption",optionType:b.dataset.type,value:b.dataset.value});if(a==="add-student-session"){if(!selectedStudentIds.includes(b.dataset.id))selectedStudentIds.push(b.dataset.id);renderStudentPick()}if(a==="remove-student-session"){selectedStudentIds=selectedStudentIds.filter(id=>id!==b.dataset.id);focusStudentIds=focusStudentIds.filter(id=>id!==b.dataset.id);renderStudentPick()}if(a==="toggle-focus-student"){focusStudentIds=focusStudentIds.includes(b.dataset.id)?focusStudentIds.filter(id=>id!==b.dataset.id):focusStudentIds.concat([b.dataset.id]);renderFocusEditor()}});
}
bind();apiGet();
</script>
</body>
