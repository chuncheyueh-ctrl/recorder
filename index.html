<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>v8 重構版</title>

<style>
body{font-family:sans-serif;padding:16px;background:#f5f5f5}
.card{background:#fff;padding:16px;border-radius:12px;margin-bottom:12px}
button{padding:12px;background:#8b5e3c;color:white;border:none;border-radius:8px}
input,select,textarea{width:100%;padding:10px;margin:6px 0}
</style>
</head>

<body>

<h2>新增紀錄</h2>

<div class="card">
<input id="date" type="date">
<select id="slot"><option>早自習</option><option>午休</option></select>
<select id="group"><option>初階</option><option>中階</option><option>大團</option></select>
<input id="teacher" placeholder="老師">
<input id="students" placeholder="學生">
<textarea id="content" placeholder="內容"></textarea>

<select id="progress">
<option>未開始</option>
<option>練習中</option>
<option>可慢速完成</option>
<option>可跟節拍器</option>
<option>可合奏</option>
<option>可演出</option>
</select>

<select id="status">
<option>未完成</option>
<option>部分完成</option>
<option>完成</option>
</select>

<input id="focus" placeholder="重點學生">
<textarea id="note" placeholder="備註"></textarea>

<button onclick="submitData()">送出</button>
</div>

<script>

const API_URL = "👉貼你的Apps Script";

async function submitData(){
  const data = {
    type:"addRecord",
    date:date.value,
    slot:slot.value,
    group:group.value,
    teacher:teacher.value,
    students:students.value,
    content:content.value,
    progress:progress.value,
    status:status.value,
    focus:focus.value,
    note:note.value
  };

  const r = await fetch(API_URL,{
    method:"POST",
    body:JSON.stringify(data)
  });

  const res = await r.json();

  if(res.ok){
    alert("成功");
  }else{
    alert(res.message);
  }
}

</script>

</body>
</html>
