isplay:grid;gap:10px}.teacher,.course,.handoff,.student,.note{background:rgba(255,255,255,.58);border:1px solid rgba(87,58,36,.08);border-radius:22px;padding:14px}.teacher{display:grid;grid-template-columns:50px 1fr auto;gap:12px;align-items:center}.avatar{width:50px;height:50px;border-radius:18px;background:var(--greenBg);display:grid;place-items:center;font-weight:900;font-size:20px;color:var(--green)}.name{font-size:19px;font-weight:950}.pill{display:inline-flex;align-items:center;margin:4px 4px 0 0;padding:7px 10px;border-radius:999px;font-size:13px;font-weight:850;background:var(--greenBg);color:var(--green)}.pill.red{background:var(--redBg);color:var(--red)}.pill.amber{background:var(--amberBg);color:var(--amber)}.pill.purple{background:var(--purpleBg);color:var(--purple)}.courseGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.course{display:grid;grid-template-columns:30px 1fr auto;gap:12px;align-items:center}.dot{width:28px;height:28px;border-radius:50%;background:var(--green);color:white;display:grid;place-items:center;font-weight:900}.dot.red{background:var(--red)}.status{padding:8px 12px;border-radius:999px;background:var(--greenBg);color:var(--green);font-weight:900}.status.todo{background:var(--redBg);color:var(--red)}.handoff{position:relative;display:grid;grid-template-columns:1fr auto;gap:12px}.handoff:before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:5px;border-radius:99px;background:var(--amber)}.empty{padding:16px;border:1px dashed var(--line);border-radius:20px;color:var(--muted);background:rgba(255,255,255,.45)}.tabs{display:flex;gap:8px;overflow:auto;padding-bottom:8px}.tab{background:#fff;color:var(--brown);border:1px solid var(--line);box-shadow:none;white-space:nowrap}.tab.active{background:var(--brown);color:white}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.day,.dow{border-radius:14px;padding:8px}.dow{text-align:center;color:var(--muted);font-size:12px}.day{min-height:80px;background:rgba(255,255,255,.6);border:1px solid var(--line);font-size:12px}.event{margin-top:5px;background:#f1e6dc;border-radius:8px;padding:5px}.bottomNav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(255,255,255,.86);backdrop-filter:blur(20px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:40}.bottomNav button{border-radius:0;background:transparent;color:#8a7669;box-shadow:none;font-size:12px;padding:9px 2px;min-height:62px}.bottomNav button.active{color:var(--brown)}.bottomNav button.active:before{content:"";display:block;width:34px;height:4px;background:var(--brown);border-radius:99px;margin:0 auto 6px}.fab{position:fixed;right:18px;bottom:78px;z-index:50;border-radius:20px}.loading{position:fixed;left:14px;bottom:16px;background:#2b2620;color:white;border-radius:999px;padding:8px 12px;font-size:13px;display:none;z-index:80}dialog{width:min(920px,calc(100vw - 18px));max-width:calc(100vw - 18px);border:0;border-radius:28px;padding:0;background:var(--card);box-shadow:0 24px 80px #0005;overflow:hidden}dialog::backdrop{background:rgba(30,20,15,.45);backdrop-filter:blur(4px)}.dHead{padding:18px 20px;border-bottom:1px solid var(--line);background:#fff7ed;border-radius:28px 28px 0 0}.dBody{padding:18px;max-height:70vh;overflow:auto;overflow-x:hidden}.dFoot{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;position:sticky;bottom:0;background:rgba(255,253,249,.96);backdrop-filter:blur(14px)}.form{display:grid;gap:13px}label{display:grid;gap:6px;font-weight:900}input,textarea,select{width:100%;border:1px solid var(--line);border-radius:18px;padding:13px;background:white}textarea{min-height:90px}.checks{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.check{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:18px;padding:10px;background:white}.check input{width:auto;margin-top:5px}.chip{display:inline-block;margin:4px;padding:9px 12px;border-radius:999px;background:#efe6d9}.chip.selected{background:#e2f5ea;font-weight:900}.wizardBars{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:12px}.wizardBars span{height:7px;border-radius:99px;background:#eadfce}.wizardBars span.active{background:var(--brown)}.wizardPage{display:none}.wizardPage.active{display:grid;gap:16px}.wizardPage h2{font-size:32px}.wizardCards{display:grid;gap:12px}.wizardCard{padding:18px;border:1px solid var(--line);border-radius:22px;background:white;font-weight:950}.wizardCard.selected{background:#fff1d6;border:3px solid var(--brown)}.wizardChips{display:flex;flex-wrap:wrap;gap:8px}@media(min-width:900px){.top{max-width:1100px;margin:auto}.app{padding-bottom:40px}.courseGrid{grid-template-columns:repeat(4,1fr)}.bottomNav{left:50%;transform:translateX(-50%);max-width:700px;border-radius:24px 24px 0 0}}@media(max-width:430px){.title h1{font-size:34px}.courseGrid{grid-template-columns:1fr}.course{grid-template-columns:30px 1fr}.course .status{grid-column:2;width:max-content}.teacher{grid-template-columns:50px 1fr}.teacher .status{grid-column:2;width:max-content}.checks{grid-template-columns:1fr}dialog{width:calc(100vw - 16px);max-width:calc(100vw - 16px);border-radius:24px}.dHead{padding:16px}.dHead h2{font-size:28px}.dBody{padding:16px;max-height:68vh}input,textarea,select{font-size:16px}}

<body>
<section class="top"><div class="topbar"><button class="icon" data-page-go="more">☰</button><button class="icon" id="refresh">♡</button></div><div class="title"><h1>中正國小直笛團</h1><div class="sub">V20 Sync Engine 教師工作台</div></div><div class="dateRow"><div>目前查看 <b id="dateLabel">讀取中</b></div><button class="secondary" id="todayBtn">今天</button></div></section>

</section>

<section class="page" id="calendar"><section class="card"><div class="row"><h2>行事曆</h2><div><button class="secondary" id="prevMonth">上月</button><button class="secondary" id="nextMonth">下月</button><button id="addEvent">新增事件</button></div></div><h3 id="monthLabel"></h3><div class="calendar" id="calendarGrid"></div></section></section>

</main>

<button class="fab" id="quickAdd">＋ 新增紀錄</button><div class="loading" id="loading">同步中……</div>

<dialog id="recordDialog"><form id="recordForm"><div class="dHead"><div class="row"><h2 id="recordTitle">新增教學紀錄</h2><button type="button" class="secondary close">關閉</button></div><div class="wizardBars"><span></span><span></span><span></span><span></span><span></span><span></span></div></div><div class="dBody wizardBody">
<section class="wizardPage active" data-step="0"><h2>1. 今天上哪一堂？</h2><div id="wizardSlotCards" class="wizardCards"></div></section>
<section class="wizardPage" data-step="1"><h2>2. 哪位老師？哪一團？</h2><label>老師<select id="recTeacher"></select></label><label>團別<select id="recGroup"></select></label></section>
<section class="wizardPage" data-step="2"><h2>3. 本堂有哪些學生？</h2><div id="studentPick" class="wizardChips"></div></section>
<section class="wizardPage" data-step="3"><h2>4. 有沒有重點學生？</h2><div id="focusPick" class="wizardChips"></div><label>重點標記<div class="checks" id="focusTagChecks"></div></label></section>
<section class="wizardPage" data-step="4"><h2>5. 團體狀況</h2><label>團體進度階段<select id="progressStage"></select></label><label>團體穩定度<select id="stability"></select></label><label>團體問題<div class="checks" id="issueChecks"></div></label><label>聲部/學生<div class="checks" id="partChecks"></div></label></section>
<section class="wizardPage" data-step="5"><h2>6. 寫下紀錄</h2><label>今天教學<textarea id="content" placeholder="今天教了什麼？"></textarea></label><label>目前進度<textarea id="progress" placeholder="目前到哪裡？"></textarea></label><label>學生狀況<textarea id="studentStatus"></textarea></label><label>交接<textarea id="handoff" placeholder="下一位老師需要注意什麼？"></textarea></label><label>狀態<select id="state"><option>未完成</option><option selected>部分完成</option><option>已完成</option></select></label></section>
</div><div class="dFoot"><button type="button" class="secondary" id="wizardPrev">上一步</button><button type="button" id="wizardNext">下一步</button><button type="submit" id="wizardSave">儲存紀錄</button></div></form></dialog>

<dialog id="availabilityDialog"><form id="availabilityForm"><div class="dHead"><div class="row"><h2>老師可到校時段</h2><button type="button" class="secondary close">關閉</button></div></div><div class="dBody form"><label>老師<select id="availTeacher"></select></label><label>可到校時段<div class="checks" id="availChecks"></div></label><label>備註<input id="availNote" placeholder="例如：可代課、只能第一節"></label></div><div class="dFoot"><button type="button" class="danger" id="clearAvailability">清除本週填報</button><button type="submit">儲存</button></div></form></dialog>
<dialog id="teacherDialog"><form id="teacherForm"><div class="dHead"><div class="row"><h2>老師資料</h2><button type="button" class="secondary close">關閉</button></div></div><div class="dBody form"><label>姓名<input id="teacherName" required></label><label>備註<input id="teacherNote"></label></div><div class="dFoot"><button type="submit">儲存</button></div></form></dialog>
<dialog id="studentDialog"><form id="studentForm"><div class="dHead"><div class="row"><h2>學生資料</h2><button type="button" class="secondary close">關閉</button></div></div><div class="dBody form"><label>姓名<input id="studentName" required></label><label>年級<input id="studentGrade"></label><label>所屬團別<div class="checks" id="studentGroups"></div></label><label>備註<input id="studentNote"></label></div><div class="dFoot"><button type="submit">儲存</button></div></form></dialog>
<dialog id="eventDialog"><form id="eventForm"><div class="dHead"><div class="row"><h2>行事曆事件</h2><button type="button" class="secondary close">關閉</button></div></div><div class="dBody form"><label>日期<input id="eventDate" type="date"></label><label>標題<input id="eventTitle"></label><label>類型<select id="eventType"><option value="practice">練習</option><option value="club">社團課</option><option value="extra">加練</option><option value="exam">考試/考核</option><option value="show">演出</option><option value="admin">行政</option><option value="other">其他</option></select></label><label>開始時間<input id="eventStart" placeholder="08:00"></label><label>結束時間<input id="eventEnd" placeholder="09:00"></label><label>地點<input id="eventLocation"></label><label>備註<textarea id="eventNote"></textarea></label></div><div class="dFoot"><button type="submit">儲存</button></div></form></dialog>
<dialog id="settingsDialog"><div class="dHead"><div class="row"><h2>設定中心</h2><button type="button" class="secondary close">關閉</button></div></div><div class="dBody"><section class="card"><h3>時段管理</h3><div class="form"><label>名稱<input id="slotName" placeholder="第二早自習"></label><label>開始<input id="slotStart" placeholder="08:00"></label><label>結束<input id="slotEnd" placeholder="08:35"></label><label>適用日<select id="slotWeekday"><option value="all">每天</option><option value="0">週一</option><option value="1">週二</option><option value="2">週三</option><option value="3">週四</option><option value="4">週五</option><option value="5">週六</option><option value="6">週日</option></select></label><button id="saveSlot" type="button">新增時段</button></div><div id="slotList"></div></section><section class="card"><h3>勾選選項</h3><label>類型<select id="configType"><option value="group">團別</option><option value="issue">團體問題</option><option value="part">聲部</option><option value="focus">重點標記</option><option value="progressStage">進度階段</option><option value="stability">穩定度</option></select></label><label>文字<input id="configValue"></label><button id="saveConfig" type="button">新增選項</button><div id="configList"></div></section></div></dialog>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbzCWmMg_zRKircWmnUlypdFkmhueW0xBtKm7s79pwNamQzE6lGGTENDiHHwLpO7561v/exec";
const CACHE_KEY="recorderV20CoreCache";
const DEVICE_ID=(()=>{let x=localStorage.getItem("recorderDeviceId");if(!x){x="dev_"+Math.random().toString(36).slice(2)+"_"+Date.now().toString(36);localStorage.setItem("recorderDeviceId",x)}return x})();
const SYNC_KEY="recorderV20SyncQueue";
let viewDate=new Date(),monthDate=new Date(),STATE={ok:true,teachers:[],students:[],slots:[],availability:[],records:[],events:[],config:{group:[],focus:[],part:[],issue:[],progressStage:[],stability:[]},analytics:{},todayAbsent:[]},selectedStudents=[],focusStudents=[],editingRecordId="",editingTeacherId="",editingStudentId="",wizardStep=0,wizardData={},isSaving=false;
const $=id=>document.getElementById(id),pad=n=>String(n).padStart(2,"0"),iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()),esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
function id(prefix){return prefix+"_"+Math.random().toString(36).slice(2,9)+"_"+Date.now().toString(36)}function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}function monday(d){d=new Date(d);d.setHours(0,0,0,0);const day=d.getDay();d.setDate(d.getDate()-day+(day===0?-6:1));return d}function dayIndex(d){const g=d.getDay();return g===0?6:g-1}function monthKey(){return monthDate.getFullYear()+"-"+pad(monthDate.getMonth()+1)}function fullDate(d){return d.getFullYear()+"/"+(d.getMonth()+1)+"/"+d.getDate()+"（"+"日一二三四五六"[d.getDay()]+"）"}function timeRange(a,b){return a&&b?a+"–"+b:(a||b||"")}function weekdayLabel(v){v=String(v??'all');if(v==='all')return '每天';const names='一二三四五六日';const n=Number(v);return Number.isInteger(n)&&n>=0&&n<7?'週'+names[n]:'未設定'}function cfg(t){return STATE.config[t]||[]}function loading(v){$("loading").style.display=v?"block":"none"}function slotText(s){return s.name+" "+timeRange(s.start,s.end)}function todaySlots(){return STATE.slots.filter(s=>String(s.weekday||'all')==='all'||String(s.weekday)===String(dayIndex(viewDate)))}
function jsonp(url){return new Promise((resolve,reject)=>{const cb="cb_"+Date.now()+"_"+Math.floor(Math.random()*999999),s=document.createElement("script"),sep=url.includes("?")?"&":"?";const timer=setTimeout(()=>{cleanup();reject(new Error("讀取逾時"))},15000);function cleanup(){clearTimeout(timer);delete window[cb];s.remove()}window[cb]=data=>{cleanup();resolve(data)};s.onerror=()=>{cleanup();reject(new Error("JSONP 載入失敗"))};s.src=url+sep+"callback="+cb+"&_="+Date.now();document.body.appendChild(s)})
function toast(msg){
  const box=$("loading");
  box.textContent=msg;
  box.style.display="block";
  clearTimeout(window.__toastTimer);
  window.__toastTimer=setTimeout(()=>{box.style.display="none";box.textContent="同步中……"},2600);
}
function queueGet(){try{return JSON.parse(localStorage.getItem(SYNC_KEY)||"[]")}catch(e){return []}}
function queueSet(list){localStorage.setItem(SYNC_KEY,JSON.stringify(list))}
function queueAdd(item){const list=queueGet().filter(x=>x.requestId!==item.requestId);list.push({...item,syncStatus:item.syncStatus||"pending",retryCount:item.retryCount||0,queuedAt:Date.now()});queueSet(list)}
function queueRemove(requestId){queueSet(queueGet().filter(x=>x.requestId!==requestId))}
function queueMarkFailed(requestId){queueSet(queueGet().map(x=>x.requestId===requestId?{...x,syncStatus:"failed",retryCount:(x.retryCount||0)+1}:x))}
function payloadIsLong(p){return p.action==="record.save" && JSON.stringify(p).length>1200}
async function postNoCors(body){await fetch(API_URL,{method:"POST",mode:"no-cors",cache:"no-cache",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)})}
async function syncCheck(item){
  const table=item.action&&item.action.indexOf("record.")===0?"records":item.action&&item.action.indexOf("event.")===0?"events":"";
  if(!table||!item.id)return false;
  const data=await jsonp(API_URL+"?payload="+encodeURIComponent(JSON.stringify({action:"sync.check",table,id:item.id,requestId:id("check")})));
  return !!(data&&data.ok&&data.found);
}
async function flushQueue(){
  const list=queueGet();
  if(!list.length||!navigator.onLine)return;
  toast("背景同步中："+list.length+" 筆");
  for(const item of list.slice(0,5)){
    try{
      if(payloadIsLong(item)){
        await postNoCors(item);
        setTimeout(async()=>{try{if(await syncCheck(item)){queueRemove(item.requestId);toast("已同步")}else{queueMarkFailed(item.requestId);toast("尚未確認同步")}}catch(e){queueMarkFailed(item.requestId)}},1500);
      }else{
        const data=await jsonp(API_URL+"?payload="+encodeURIComponent(JSON.stringify(item)));
        if(data&&data.ok)queueRemove(item.requestId);else queueMarkFailed(item.requestId);
      }
    }catch(e){queueMarkFailed(item.requestId)}
  }
  setTimeout(()=>apiGet(),1800);
}
window.addEventListener("online",flushQueue);
function syncBadgeHtml(status){
  if(status==="pending")return '<span class="pill amber">同步中</span>';
  if(status==="failed")return '<span class="pill red">同步失敗</span>';
  return '<span class="pill">已同步</span>';
}
function updateSyncPanel(){

function isLongPayload(payload){

  if(payload.action==='record.save') return size>1400 || !!(payload.content||payload.progress||payload.studentStatus||payload.handoff);

async function postNoCors(body){
  await fetch(API_URL,{method:"POST",mode:"no-cors",cache:"no-cache",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)});
  return {ok:true,opaque:true};
}
async function flushPending(){
  const list=getPending();
  if(!list.length || !navigator.onLine)return;
  for(const item of list.slice(0,5)){

async function apiPost(payload,opt={reload:true,optimistic:null}){
  if(isSaving)return;
  isSaving=true;
  const backup=JSON.stringify(STATE);
  const nowIso=new Date().toISOString();
  const body={...payload,requestId:Date.now()+"-"+Math.random(),deviceId:DEVICE_ID,updatedAt:payload.updatedAt||nowIso,version:payload.version||Date.now()};
  const longPayload=payloadIsLong(body);

  if(opt.optimistic){
    opt.optimistic(body);
    render();
    updateSyncPanel();
    try{localStorage.setItem(CACHE_KEY,JSON.stringify(STATE))}catch(e){}
  }

  try{
    if(longPayload){
      queueAdd({...body,syncStatus:"pending"});
      toast("已暫存，背景同步中……");
      if(navigator.onLine)flushQueue();
      return {ok:true,pending:true};
    }else{
      loading(true);document.querySelectorAll("button").forEach(b=>b.disabled=true);
      const data=await jsonp(API_URL+"?payload="+encodeURIComponent(JSON.stringify(body)));
      if(!data.ok)throw new Error(data.message||"寫入失敗");
      if(opt.reload!==false)apiGet();
      return data;
    }
  }catch(e){
    try{STATE=JSON.parse(backup);render();localStorage.setItem(CACHE_KEY,JSON.stringify(STATE))}catch(x){}
    toast("同步失敗，已回復畫面");
    alert("寫入失敗："+e.message);
    throw e;
  }finally{
    isSaving=false;document.querySelectorAll("button").forEach(b=>b.disabled=false);loading(false);updateSyncPanel();
  }
}

$("saveConfig").onclick=()=>{const item={id:id("cfg"),type:$("configType").value,value:$("configValue").value,sort:999};apiPost({action:'config.save',...item},{optimistic:()=>{if(!STATE.config[item.type])STATE.config[item.type]=[];STATE.config[item.type].push(item.value)}}).then(()=>$("configValue").value='')};
}
bind();apiGet();setTimeout(flushQueue,1500);setTimeout(flushPending,1800);
</script>
</body>
</html>
