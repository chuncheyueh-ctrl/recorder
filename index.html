<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>中正國小直笛團 V21</title><style>
:root{--bg:#fbf7f1;--card:#fffdf9;--ink:#3d2419;--muted:#88776c;--line:#e7dcd3;--brand:#9a623b;--red:#bd3d3d;--green:#3d8b55;--shadow:0 16px 36px #3d241914;--r:26px}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#fffaf4,#f6eee5);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif;font-weight:750}button,input,select,textarea{font:inherit}button{border:1px solid var(--line);background:#fff;color:var(--brand);border-radius:999px;padding:12px 18px;font-weight:900}button.primary{background:linear-gradient(135deg,#c58b66,var(--brand));color:white;border:0}button.danger{background:var(--red);color:white;border:0}button.small{padding:7px 11px;font-size:14px}.app{max-width:980px;margin:auto;padding:22px 16px 108px}h1{font-size:40px;margin:28px 0 4px}.ver{color:var(--muted);font-size:18px}.bar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin:28px 0;flex-wrap:wrap}.date{font-size:32px;font-weight:1000}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:20px;margin:16px 0}.head{display:flex;justify-content:space-between;gap:12px;align-items:center}.head h2{margin:0;font-size:29px}.sub{color:var(--muted)}.list{display:grid;gap:12px;margin-top:14px}.item{background:#fff;border:1px solid var(--line);border-radius:22px;padding:15px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.empty{border:1px dashed var(--line);border-radius:20px;padding:16px;color:var(--muted);margin-top:14px}.pill{display:inline-block;border-radius:999px;background:#f3eadf;color:var(--brand);padding:6px 10px;margin:3px;font-size:13px}.green{background:#e8f5e9;color:var(--green)}.red{background:#ffe8e8;color:var(--red)}.tabs{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);width:min(92vw,650px);display:grid;grid-template-columns:repeat(5,1fr);background:#fffffff2;border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow);overflow:hidden}.tab{border:0;border-radius:0;background:transparent;color:var(--muted);padding:13px 4px}.tab.active{color:var(--brand)}.page{display:none}.page.active{display:block}.fab{position:fixed;right:22px;bottom:88px}.chips{display:flex;gap:10px;overflow:auto}.chip{min-width:84px}.chip.active{background:var(--brand);color:white}.wd{font-size:12px;opacity:.75;margin-top:2px}dialog{border:0;border-radius:28px;padding:0;width:min(92vw,720px);background:var(--card);color:var(--ink);box-shadow:0 28px 80px #0004}dialog::backdrop{background:#0007;backdrop-filter:blur(3px)}.dh{display:flex;justify-content:space-between;padding:20px;border-bottom:1px solid var(--line);background:#fff7ef}.db{padding:20px;max-height:74vh;overflow:auto}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:17px;padding:13px;background:#fffdf9;color:var(--ink);font-weight:750}textarea{min-height:86px}label{display:block;margin:11px 0 5px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 15px}.full{grid-column:1/-1}.toast{position:fixed;left:20px;bottom:90px;background:#2b211d;color:#fff;border-radius:99px;padding:12px 18px;display:none;z-index:99}@media(max-width:760px){h1{font-size:34px}.date{font-size:28px}.grid{grid-template-columns:1fr}.app{padding:18px 14px 108px}}
</style></head><body><div class="app"><div class="row"><button>☰</button><button>♡</button></div><h1>中正國小直笛團</h1><div class="ver">V21.0.1 Clean Core Settings Fix 教師工作台</div><div class="bar"><button id="prevDay">前一天</button><div>目前查看 <span class="date" id="currentDate">讀取中</span></div><button id="todayBtn">今天</button><button id="nextDay">後一天</button></div>
<section id="page-today" class="page active"><div class="card"><div class="head"><h2>可到校老師</h2><button id="openAvail">查看 / 填寫</button></div><div class="sub" id="availSummary"></div><div id="todayAvailability" class="list"></div></div><div class="card"><div class="head"><h2>課程紀錄</h2><button id="openRecordList">查看全部</button></div><div class="sub" id="recordSummary"></div><div id="todayRecords" class="list"></div></div><div class="card"><div class="head"><h2>教學接力</h2></div><div class="sub" id="handoffSummary"></div><div id="handoffList" class="list"></div></div><div class="card"><div class="head"><h2>未參與學生</h2></div><div id="absentList"></div></div></section>
<section id="page-records" class="page"><div class="card"><div class="head"><h2>依日期與時段填寫</h2></div><div id="weekChips" class="chips"></div></div><div class="card"><div class="head"><h2>本週所有紀錄</h2></div><div id="allRecords" class="list"></div></div></section>
<section id="page-calendar" class="page"><div class="card"><div class="head"><h2>行事曆</h2><button id="addEvent">新增事件</button></div><div id="eventList" class="list"></div></div></section>
<section id="page-analytics" class="page"><div class="card"><div class="head"><h2>分析</h2></div><div id="analyticsBox" class="list"></div></div></section>
<section id="page-more" class="page"><div class="card"><div class="head"><h2>老師管理</h2><button id="addTeacher">新增老師</button></div><div id="teacherList" class="list"></div></div><div class="card"><div class="head"><h2>學生管理</h2><button id="addStudent">新增學生</button></div><div id="studentList" class="list"></div></div><div class="card"><div class="head"><h2>時段管理</h2><button id="addSlot">新增時段</button></div><div id="slotList" class="list"></div></div></section></div>
<button class="primary fab" id="fab">＋ 新增紀錄</button><div class="tabs"><button class="tab active" data-page="today">今日</button><button class="tab" data-page="records">紀錄</button><button class="tab" data-page="calendar">行事曆</button><button class="tab" data-page="analytics">分析</button><button class="tab" data-page="more">更多</button></div><div class="toast" id="toast">同步中</div>
<dialog id="recordDialog"><div class="dh"><h2>教學紀錄</h2><button onclick="closeDialog('recordDialog')">關閉</button></div><div class="db"><form id="recordForm"><input type="hidden" id="recordId"><div class="grid"><label>日期<input type="date" id="recordDate"></label><label>時段<select id="recordSlot"></select></label><label>團別<select id="recordGroup"></select></label><label>老師<select id="recordTeacher"></select></label><label class="full">今天教學<textarea id="recordContent"></textarea></label><label class="full">目前進度<textarea id="recordProgress"></textarea></label><label class="full">學生狀況<textarea id="recordStudentStatus"></textarea></label><label class="full">交接<textarea id="recordHandoff"></textarea></label><label>狀態<select id="recordState"></select></label></div><p><button class="primary" type="submit">儲存紀錄</button></p></form></div></dialog>
<dialog id="availDialog"><div class="dh"><h2>老師可到校</h2><button onclick="closeDialog('availDialog')">關閉</button></div><div class="db"><form id="availForm"><div class="grid"><label>日期<input type="date" id="availDate"></label><label>老師<select id="availTeacher"></select></label><label class="full">可到校時段<div id="availSlots" class="list"></div></label><label class="full">備註<textarea id="availNote"></textarea></label></div><p><button class="primary" type="submit">儲存可到校</button></p></form></div></dialog>
<dialog id="teacherDialog"><div class="dh"><h2>老師資料</h2><button onclick="closeDialog('teacherDialog')">關閉</button></div><div class="db"><form id="teacherForm"><input type="hidden" id="teacherId"><label>姓名<input id="teacherName"></label><label>備註<textarea id="teacherNote"></textarea></label><p><button class="primary" type="submit">儲存老師</button></p></form></div></dialog>
<dialog id="studentDialog"><div class="dh"><h2>學生資料</h2><button onclick="closeDialog('studentDialog')">關閉</button></div><div class="db"><form id="studentForm"><input type="hidden" id="studentId"><div class="grid"><label>姓名<input id="studentName"></label><label>年級<input id="studentGrade"></label><label class="full">所屬團別<input id="studentGroups"></label><label class="full">備註<textarea id="studentNote"></textarea></label></div><p><button class="primary" type="submit">儲存學生</button></p></form></div></dialog>
<dialog id="slotDialog"><div class="dh"><h2>時段資料</h2><button onclick="closeDialog('slotDialog')">關閉</button></div><div class="db"><form id="slotForm"><input type="hidden" id="slotId"><div class="grid"><label>名稱<input id="slotName"></label><label>適用日<select id="slotWeekday"><option value="all">每天</option><option value="1">週一</option><option value="2">週二</option><option value="3">週三</option><option value="4">週四</option><option value="5">週五</option><option value="6">週六</option><option value="0">週日</option></select></label><label>開始<input id="slotStart" placeholder="08:05"></label><label>結束<input id="slotEnd" placeholder="08:35"></label><label class="full">備註<textarea id="slotNote"></textarea></label></div><p><button class="primary" type="submit">儲存時段</button></p></form></div></dialog>
<dialog id="eventDialog"><div class="dh"><h2>行事曆事件</h2><button onclick="closeDialog('eventDialog')">關閉</button></div><div class="db"><form id="eventForm"><input type="hidden" id="eventId"><div class="grid"><label>日期<input type="date" id="eventDate"></label><label>類型<select id="eventType"></select></label><label class="full">標題<input id="eventTitle"></label><label>開始<input id="eventStart"></label><label>結束<input id="eventEnd"></label><label class="full">地點<input id="eventLocation"></label><label class="full">備註<textarea id="eventNote"></textarea></label></div><p><button class="primary" type="submit">儲存事件</button></p></form></div></dialog>
<script>
const API_URL='PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE';
const $=id=>document.getElementById(id);const state={dateKey:toDateKey(new Date()),page:'today',teachers:[],students:[],slots:[],availability:[],records:[],events:[],config:{}};
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function id(p){return p+'_'+Math.random().toString(36).slice(2,10)+'_'+Date.now().toString(36)}function pad(n){return String(n).padStart(2,'0')}function toDateKey(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}function parseDate(k){const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)}function zhWeek(d){return ['日','一','二','三','四','五','六'][d.getDay()]}function displayDate(k){const d=parseDate(k);return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}（${zhWeek(d)}）`}function mdWeek(k){const d=parseDate(k);return `${d.getMonth()+1}/${d.getDate()}（${zhWeek(d)}）`}function monday(k){const d=parseDate(k),day=d.getDay(),diff=day===0?-6:1-day;d.setDate(d.getDate()+diff);return toDateKey(d)}function addDays(k,n){const d=parseDate(k);d.setDate(d.getDate()+n);return toDateKey(d)}function weekDates(k){const s=monday(k);return Array.from({length:7},(_,i)=>addDays(s,i))}function timeRange(a,b){return `${a||''}${b?'–'+b:''}`}function weekdayOk(s,k){return !s.weekday||s.weekday==='all'||String(parseDate(k).getDay())===String(s.weekday)}function toast(msg){const t=$('toast');t.textContent=msg;t.style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.style.display='none',2200)}function closeDialog(id){$(id).close()}
function jsonp(url){return new Promise((resolve,reject)=>{const cb='cb_'+Date.now()+'_'+Math.random().toString(36).slice(2),sep=url.includes('?')?'&':'?';const s=document.createElement('script');const timer=setTimeout(()=>{cleanup();reject(new Error('讀取逾時'))},45000);function cleanup(){clearTimeout(timer);delete window[cb];s.remove()}window[cb]=d=>{cleanup();resolve(d)};s.onerror=()=>{cleanup();reject(new Error('JSONP 載入失敗'))};s.src=url+sep+'callback='+cb+'&_='+Date.now();document.body.appendChild(s)})}
async function apiGet(){if(!API_URL||API_URL.includes('PASTE_YOUR')){alert('請先在 index.html 設定 API_URL');return}toast('讀取中');const ws=monday(state.dateKey),mo=state.dateKey.slice(0,7);const d=await jsonp(API_URL+'?dateKey='+encodeURIComponent(state.dateKey)+'&weekStart='+encodeURIComponent(ws)+'&month='+encodeURIComponent(mo));if(!d.ok){alert('讀取失敗：'+(d.message||''));return}Object.assign(state,d);render()}
async function apiPost(p){p.requestId=p.requestId||id('req');toast('寫入中');const r=await jsonp(API_URL+'?payload='+encodeURIComponent(JSON.stringify(p)));if(!r||!r.ok){alert('寫入失敗：'+(r&&r.message?r.message:'未知錯誤'));return r}toast('已儲存');await apiGet();return r}
function optionHtml(items,sel=''){return items.map(x=>`<option value="${esc(x.id||x)}" ${String(sel)===String(x.id||x)?'selected':''}>${esc(x.name||x.value||x)}</option>`).join('')}function todaySlots(){return state.slots.filter(s=>weekdayOk(s,state.dateKey))}
function render(){currentDate.textContent=displayDate(state.dateKey);document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.page===state.page));document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));$('page-'+state.page).classList.add('active');renderToday();renderRecordsPage();renderCalendar();renderAnalytics();renderMore();fillSelects()}
function renderToday(){const av=state.availability.filter(a=>a.dateKey===state.dateKey),rec=state.records.filter(r=>r.dateKey===state.dateKey),slots=todaySlots();availSummary.textContent=`${new Set(av.map(a=>a.teacherId)).size} 位老師・共 ${av.length} 個時段`;todayAvailability.innerHTML=av.length?av.map(a=>`<div class="item row"><div><b>${esc(a.teacherName)}</b><div>${esc(a.slotName)} ${timeRange(a.start,a.end)}</div>${a.note?`<div class="sub">${esc(a.note)}</div>`:''}</div><span class="pill green">可到校</span></div>`).join(''):'<div class="empty">目前這一天尚無老師填寫可到校時段。</div>';recordSummary.textContent=`共 ${slots.length} 節課・待完成 ${Math.max(0,slots.length-rec.length)} 節`;todayRecords.innerHTML=slots.length?slots.map(s=>{const r=rec.find(x=>x.slotId===s.id);return r?recordCard(r):`<div class="item row"><div><b>${esc(s.name)}</b><div>${timeRange(s.start,s.end)}<br>${mdWeek(state.dateKey)}</div></div><button class="pill red" onclick="openRecord('${s.id}')">待填寫 ›</button></div>`}).join(''):'<div class="empty">今天沒有適用時段。</div>';const hand=rec.filter(r=>r.handoff);handoffSummary.textContent=`${hand.length} 則交接`;handoffList.innerHTML=hand.length?hand.map(r=>`<div class="item"><b>${esc(r.groupName||'未分類')}｜${esc(r.teacherName||'')}</b><div>${esc(r.handoff)}</div><div class="sub">${esc(r.slotName)} ${timeRange(r.start,r.end)}</div></div>`).join(''):'<div class="empty">目前沒有交接事項。</div>';absentList.innerHTML=state.students.length?state.students.slice(0,20).map(s=>`<span class="pill">${esc(s.name)}</span>`).join(''):'<div class="empty">尚未建立學生名單。</div>'}
function recordCard(r){return `<div class="item"><div class="row"><div><b>${esc(r.slotName)} ${timeRange(r.start,r.end)}</b><div class="sub">${esc(r.dateKey)}｜${esc(r.groupName)}｜${esc(r.teacherName)}</div></div><span class="pill green">${esc(r.state||'已完成')}</span></div>${r.content?`<p><b>教學：</b>${esc(r.content)}</p>`:''}${r.progress?`<p><b>進度：</b>${esc(r.progress)}</p>`:''}${r.studentStatus?`<p><b>學生：</b>${esc(r.studentStatus)}</p>`:''}${r.handoff?`<p><b>交接：</b>${esc(r.handoff)}</p>`:''}<button class="small" onclick="openRecord('${esc(r.slotId)}','${esc(r.id)}')">編輯</button> <button class="small danger" onclick="deleteRecord('${esc(r.id)}')">刪除</button></div>`}
function renderRecordsPage(){weekChips.innerHTML=weekDates(state.dateKey).map(d=>`<button class="chip ${d===state.dateKey?'active':''}" onclick="changeDate('${d}')"><div>${d.slice(5).replace('-','/')}</div><div class="wd">（${zhWeek(parseDate(d))}）</div></button>`).join('');allRecords.innerHTML=state.records.length?state.records.map(recordCard).join(''):'<div class="empty">本週沒有紀錄。</div>'}function renderCalendar(){eventList.innerHTML=state.events.length?state.events.map(e=>`<div class="item row"><div><b>${esc(e.title)}</b><div>${esc(e.dateKey)}｜${esc(e.type)}｜${timeRange(e.start,e.end)}</div><div class="sub">${esc(e.location||'')}</div></div><button class="danger small" onclick="deleteEvent('${esc(e.id)}')">刪除</button></div>`).join(''):'<div class="empty">本月沒有事件。</div>'}function renderAnalytics(){analyticsBox.innerHTML=`<div class="item"><b>本週紀錄</b><div>${state.records.length} 筆</div></div><div class="item"><b>老師</b><div>${state.teachers.length} 位</div></div><div class="item"><b>學生</b><div>${state.students.length} 位</div></div><div class="item"><b>時段</b><div>${state.slots.length} 個</div></div>`}
function renderMore(){teacherList.innerHTML=state.teachers.length?state.teachers.map(t=>`<div class="item row"><div><b>${esc(t.name)}</b><div class="sub">${esc(t.note||'')}</div></div><div><button class="small" onclick="openTeacher('${esc(t.id)}')">編輯</button> <button class="small danger" onclick="deleteTeacher('${esc(t.id)}')">刪除</button></div></div>`).join(''):'<div class="empty">尚無老師。</div>';studentList.innerHTML=state.students.length?state.students.map(s=>`<div class="item row"><div><b>${esc(s.name)}</b><div class="sub">${esc(s.grade||'')} ${esc(s.groups||'')}</div></div><div><button class="small" onclick="openStudent('${esc(s.id)}')">編輯</button> <button class="small danger" onclick="deleteStudent('${esc(s.id)}')">刪除</button></div></div>`).join(''):'<div class="empty">尚無學生。</div>';slotList.innerHTML=state.slots.length?state.slots.map(s=>`<div class="item row"><div><b>${esc(s.name)}</b><div class="sub">${timeRange(s.start,s.end)}｜${s.weekday==='all'?'每天':'週'+['日','一','二','三','四','五','六'][Number(s.weekday)]}</div></div><div><button class="small" onclick="openSlot('${esc(s.id)}')">編輯</button> <button class="small danger" onclick="deleteSlot('${esc(s.id)}')">刪除</button></div></div>`).join(''):'<div class="empty">尚無時段。</div>'}
function fillSelects(){recordSlot.innerHTML=optionHtml(todaySlots());recordTeacher.innerHTML=optionHtml(state.teachers);availTeacher.innerHTML=optionHtml(state.teachers);recordGroup.innerHTML=optionHtml(state.config.group||[]);recordState.innerHTML=optionHtml(state.config.state||['已完成']);eventType.innerHTML=optionHtml(state.config.eventType||[]);availSlots.innerHTML=todaySlots().map(s=>`<label class="item"><input type="checkbox" value="${esc(s.id)}"> ${esc(s.name)} ${timeRange(s.start,s.end)}</label>`).join('')}
function openRecord(slotId='',rid=''){const r=state.records.find(x=>x.id===rid)||{};recordId.value=r.id||'';recordDate.value=r.dateKey||state.dateKey;fillSelects();recordSlot.value=r.slotId||slotId||todaySlots()[0]?.id||'';recordGroup.value=r.groupName||'';recordTeacher.value=r.teacherId||state.teachers[0]?.id||'';recordContent.value=r.content||'';recordProgress.value=r.progress||'';recordStudentStatus.value=r.studentStatus||'';recordHandoff.value=r.handoff||'';recordState.value=r.state||'已完成';recordDialog.showModal()}function openAvail(){availDate.value=state.dateKey;fillSelects();availTeacher.value=state.teachers[0]?.id||'';availNote.value='';availDialog.showModal()}function openTeacher(id=''){const t=state.teachers.find(x=>x.id===id)||{};teacherId.value=t.id||'';teacherName.value=t.name||'';teacherNote.value=t.note||'';teacherDialog.showModal()}function openStudent(id=''){const s=state.students.find(x=>x.id===id)||{};studentId.value=s.id||'';studentName.value=s.name||'';studentGrade.value=s.grade||'';studentGroups.value=s.groups||'';studentNote.value=s.note||'';studentDialog.showModal()}function openSlot(id=''){const s=state.slots.find(x=>x.id===id)||{};slotId.value=s.id||'';slotName.value=s.name||'';slotStart.value=s.start||'';slotEnd.value=s.end||'';slotWeekday.value=s.weekday||'all';slotNote.value=s.note||'';slotDialog.showModal()}function openEvent(id=''){const e=state.events.find(x=>x.id===id)||{};eventId.value=e.id||'';eventDate.value=e.dateKey||state.dateKey;eventTitle.value=e.title||'';eventType.value=e.type||'';eventStart.value=e.start||'';eventEnd.value=e.end||'';eventLocation.value=e.location||'';eventNote.value=e.note||'';eventDialog.showModal()}function changeDate(k){state.dateKey=k;apiGet()}async function deleteRecord(id){if(confirm('刪除這筆紀錄？'))await apiPost({action:'record.delete',id})}async function deleteTeacher(id){if(confirm('刪除老師？'))await apiPost({action:'teacher.delete',id})}async function deleteStudent(id){if(confirm('刪除學生？'))await apiPost({action:'student.delete',id})}async function deleteSlot(id){if(confirm('刪除時段？'))await apiPost({action:'slot.delete',id})}async function deleteEvent(id){if(confirm('刪除事件？'))await apiPost({action:'event.delete',id})}
