<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>直笛系統 v8 Final</title>

<style>
body{font-family:sans-serif;background:#f5f5f5;padding:10px}
.card{background:#fff;padding:12px;margin:10px 0;border-radius:10px}
button{margin:5px;padding:10px;border:none;border-radius:8px;background:#8b5e3c;color:white}
.selected{background:#ffcc80}
</style>
</head>

<body>

<h2>老師列表</h2>
<div id="teacherList"></div>

<hr>

<h2>新增紀錄</h2>

<div class="card">
<input type="date" id="date">

<select id="slot">
<option>早自習</option>
<option>午休</option>
<option>社團</option>
</select>

<div id="students"></div>

<textarea id="content" placeholder="教學內容"></textarea>

<select id="progress">
<option>未開始</option>
<option>練習中</option>
<option>可慢速完成</option>
<option>可跟節拍器</option>
<option>可合奏</option>
<option>可演出</option>
</select>

<select id="status">
<option>未完成</option>
<option>部分完成</option>
<option>完成</option>
</select>

<textarea id="note" placeholder="備註"></textarea>

<button onclick="submitRecord()">送出</button>
</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbyETeSmu9v0IBb6uz7xGsZ8lT_PBOV0mv03PhCc6SwoSe_FXeX7Wi2dtzhM0SOXpE8O/exec";

let teachers=[],students=[];
let selectedTeacher=null;
let selectedStudents=[];

async function load(){
  const r = await fetch(API_URL);
  const d = await r.json();
  teachers = d.teachers;
  students = d.students;
  renderTeachers();
}

function renderTeachers(){
  const div = document.getElementById("teacherList");
  div.innerHTML="";
  teachers.forEach(t=>{
    const el=document.createElement("div");
    el.className="card";
    el.innerHTML=`
      <b>${t[0]}</b><br>
      <button onclick="selectTeacher('${t[0]}')">新增紀錄</button>
      <button>修改</button>
      <button>封存</button>
    `;
    div.appendChild(el);
  });
}

function selectTeacher(name){
  selectedTeacher=name;
  renderStudents();
}

function renderStudents(){
  const div=document.getElementById("students");
  div.innerHTML="";
  selectedStudents=[];
  students.forEach(s=>{
    const btn=document.createElement("button");
    btn.innerText=s[0];
    btn.onclick=()=>{
      if(selectedStudents.includes(s[0])){
        selectedStudents=selectedStudents.filter(x=>x!==s[0]);
        btn.classList.remove("selected");
      }else{
        selectedStudents.push(s[0]);
        btn.classList.add("selected");
      }
    };
    div.appendChild(btn);
  });
}

async function submitRecord(){
  const data={
    type:"addRecord",
    date:date.value,
    slot:slot.value,
    group:"",
    teacher:selectedTeacher,
    students:selectedStudents,
    content:content.value,
    progress:progress.value,
    status:status.value,
    focus:selectedStudents,
    note:note.value
  };

  await fetch(API_URL,{
    method:"POST",
    body:JSON.stringify(data)
  });

  alert("成功");
}

load();

</script>

</body>
</html>
